{% extends 'base.html' %}
{% load static %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7">

            <div class="card shadow login-card">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <img src="{% static 'images/apex_bank_logo.svg' %}"
                             alt="Logo"
                             class="login-logo">

                        <h2 class="mt-3">Login</h2>

                        <p class="text-muted">
                            Access your account securely
                        </p>

                    </div>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <input type="text"
                                   name="username_or_email"
                                   class="form-control"
                                   placeholder="Username or Email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <input type="password"
                                   name="password"
                                   class="form-control "
                                   placeholder="Password"
                                   required>
                        </div>

                        <button class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
