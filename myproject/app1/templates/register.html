{% extends 'base.html' %}
{% load static %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow login-card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img src="{% static 'images/apex_bank_logo.svg' %}"
                             alt="Logo"
                             class="login-logo">
                        <h2 class="mt-3">Register</h2>
                        <p class="text-muted">
                            Create your account to get started
                        </p>
                    </div>

                    <form method="POST" id="register-form">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" 
                                   name="full_name" 
                                   class="form-control" 
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" 
                                   name="phone" 
                                   class="form-control" 
                                   placeholder="Enter your phone number"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" 
                                   name="email" 
                                   class="form-control" 
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="position-relative">
                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="Enter password"
                                       required>
                                <span onclick="togglePassword('password', this)"
                                      style="position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;">
                                    👁️
                                </span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="position-relative">
                                <input type="password"
                                       id="confirm_password"
                                       name="confirm_password"
                                       class="form-control"
                                       placeholder="Confirm password"
                                       required>
                                <span onclick="togglePassword('confirm_password', this)"
                                      style="position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;">
                                    👁️
                                </span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Send OTP
                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="{% url 'login' %}">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
