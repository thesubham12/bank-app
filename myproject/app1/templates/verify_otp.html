{% extends 'base.html' %}

{% block title %}Verify OTP{% endblock %}

{% block content %}

<div style="max-width:420px;margin:60px auto;padding:32px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);">
  <h2 style="color:#1a73e8;margin-bottom:4px;">Verify OTP</h2>
  <p style="color:#555;font-size:14px;">Enter the 6-digit OTP sent to your email. It expires in <strong>30 seconds</strong>.</p>

  {% if error %}
  <div style="color:#e53935;background:#fdecea;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px;">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" id="otpForm">
    {% csrf_token %}
    <div style="margin-bottom:16px;">
      <input type="text"
             name="otp"
             id="otpInput"
             class="form-control"
             placeholder="Enter OTP"
             maxlength="6"
             inputmode="numeric"
             autocomplete="off"
             style="font-size:22px;letter-spacing:6px;text-align:center;">
    </div>

    <!-- Timer -->
    <div style="text-align:center;margin-bottom:16px;">
      <span id="timerTxt" style="color:#888;font-size:13px;">
        OTP expires in <strong id="timerCount" style="color:#1a73e8;">30</strong>s
      </span>
      <span id="expiredTxt" style="display:none;font-size:13px;color:#e53935;">
        OTP expired!
      </span>
    </div>

    <button class="btn btn-primary w-100" id="verifyBtn">Verify OTP</button>
  </form>

  <!-- Resend form (hidden initially) -->
  <form method="GET" action="{% url 'resend_otp' %}" id="resendForm" style="display:none;margin-top:12px;">
    <button type="submit" class="btn btn-outline-primary w-100">Resend OTP</button>
  </form>
</div>

{% endblock %}
